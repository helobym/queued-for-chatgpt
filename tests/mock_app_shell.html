<!doctype html><html><head><meta charset="utf-8"><title>ChatGPT app shell test fixture</title></head><body>
<main data-app-shell-main-surface="browser"><div data-app-action-timeline-scroll role="region" id="timeline"></div></main>
<form data-chatgpt-composer><div id="prompt-textarea" class="ProseMirror" contenteditable="true" role="textbox"></div><button type="button" data-testid="send-button">Send</button></form>
<script>
 const data={}; const listeners=[]; window.chrome={storage:{onChanged:{addListener(cb){listeners.push(cb);}},local:{async get(input){const ks=typeof input==='string'?[input]:Array.isArray(input)?input:Object.keys(input||{});return Object.fromEntries(ks.map(k=>[k,data[k]]));},async set(next){for (const [k,v] of Object.entries(next)){const old=data[k];data[k]=JSON.parse(JSON.stringify(v));for(const cb of listeners)cb({[k]:{oldValue:old,newValue:data[k]}},'local');}}}},onChanged:{addListener(cb){listeners.push(cb);}}};
 let sent=0; window.__sentCount=0;
 document.querySelector('[data-testid="send-button"]').addEventListener('click',()=>{
   const editor=document.querySelector('#prompt-textarea');const content=editor.innerText.trim(); if(!content)return;
   if(!window.__mockRoute){window.__mockRoute='chat:app-shell-new';window.dispatchEvent(new Event('popstate'));}
   window.__sentCount=++sent;
   const turn=document.createElement('div');turn.dataset.turnKey='turn-'+sent;
   const user=document.createElement('div');user.dataset.chatgptSearchUnitKey='fallback-turn-'+sent+':0:user';
   const bubble=document.createElement('div');bubble.dataset.userMessageBubble='true';bubble.textContent=content;user.append(bubble);turn.append(user);
   document.querySelector('#timeline').append(turn);editor.innerHTML='';
   setTimeout(()=>{
     const unit=document.createElement('div');unit.dataset.chatgptSearchUnitKey='fallback-turn-'+sent+':0:assistant';
     const reply=document.createElement('div');reply.dataset.markdownTextStyle='assistant-message';reply.textContent='Simulated app shell reply to '+content;
     unit.append(reply);turn.append(unit);
     if(!window.__suppressCompletedActions){setTimeout(()=>{
        const footer=document.createElement('div');footer.className='turn-action-controls';
        const copy=document.createElement('button');copy.textContent='Copy';copy.setAttribute('aria-label','Copy');footer.append(copy);turn.append(footer);
     }, 350);}
   },280);
 });
</script></body></html>
