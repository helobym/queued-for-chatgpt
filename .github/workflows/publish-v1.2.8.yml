name: Publish v1.2.8 GitHub Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.2.8.yml'
      - 'content.js'
      - 'content.css'
      - 'background.js'
      - 'manifest.json'
      - 'tests/**'
      - 'README.md'
      - 'PRIVACY.md'
      - 'CHANGELOG.md'
      - 'UPGRADE-CHECKLIST.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout v1.2.8 source
        uses: actions/checkout@v4

      - name: Set up Python for simulated browser tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JavaScript queue and coordinator tests
        run: |
          node --test tests/*.test.js
          node --check content.js
          node --check background.js
          node --check core.js
          node --check coordinator.js

      - name: Check Python regression script syntax and preview asset
        run: |
          python3 -m compileall -q tests
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          ElementTree.parse('screenshots/workflows-v1.2.7.svg')
          ElementTree.parse('screenshots/queue-v1.2.7.svg')
          assert 'Recent activity' in Path('content.js').read_text(encoding='utf-8')
          assert 'hasNewUserReceipt' in Path('content.js').read_text(encoding='utf-8')
          assert 'lastCompleted' in Path('coordinator.js').read_text(encoding='utf-8')
          assert 'releases/tag/v1.2.8' in Path('README.md').read_text(encoding='utf-8')
          assert '+ Load' in Path('content.js').read_text(encoding='utf-8')
          assert 'load-workflow' in Path('content.js').read_text(encoding='utf-8')
          assert 'projectLandingId' in Path('content.js').read_text(encoding='utf-8')
          assert "case 'copy':" in Path('content.js').read_text(encoding='utf-8')
          assert "case 'copy-workflow-step':" in Path('content.js').read_text(encoding='utf-8')
          assert "function dockDisplay()" in Path('content.js').read_text(encoding='utf-8')
          assert "state.senderLockRoute = route;" in Path('content.js').read_text(encoding='utf-8')
          assert "qfc-workflow-details" in Path('content.js').read_text(encoding='utf-8')
          assert "qfc-activity-details" in Path('content.js').read_text(encoding='utf-8')
          assert "qfc-ui-v1" in Path('background.js').read_text(encoding='utf-8')
          import json
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['commands']['toggle-queue-panel']['suggested_key']['default'] == 'Alt+Shift+Q'
          assert 'notifications' in manifest['permissions']
          assert "command: 'runLifecycle'" in Path('content.js').read_text(encoding='utf-8')
          assert "chrome.notifications" in Path('background.js').read_text(encoding='utf-8')
          PY

      - name: Install Chromium for simulated browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' \) | head -n 1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium

      - name: Run simulated Chromium reliability regressions
        run: |
          python3 tests/smoke_notifications.py
          python3 tests/smoke_v127_ui.py
          python3 tests/smoke_send_receipt_safety.py
          python3 tests/smoke_app_shell.py
          python3 tests/smoke_first_reply_fallback.py
          python3 tests/smoke_workflow_load_during_run.py
          python3 tests/smoke_workflow_new_chat.py
          python3 tests/smoke_workflow_direct_start_safety.py
          python3 tests/smoke_project_workflows.py
          python3 tests/smoke_queue_copy.py
          python3 tests/smoke_workflows.py
          python3 tests/smoke_draggable_panel.py
          python3 tests/smoke_browser.py

      - name: Create unpacked-extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '1.2.8', 'This workflow only publishes v1.2.8'
          required = [
              'manifest.json', 'background.js', 'content.js', 'content.css',
              'core.js', 'coordinator.js', 'LICENSE', 'NOTICE.txt',
              'PRIVACY.md', 'README.md', 'UPGRADE-CHECKLIST.txt'
          ]
          required += [str(f) for f in sorted((root / 'icons').glob('*.png'))]
          assert len(required) >= 14, 'Extension icons are missing'
          archive = pathlib.Path('queued-for-chatgpt-v1.2.8.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as zipped:
              for name in required:
                  file = root / name
                  assert file.is_file(), f'Missing {name}'
                  zipped.write(file, arcname=name)
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.testzip() is None, 'Corrupt ZIP'
              assert 'manifest.json' in zipped.namelist(), 'Manifest must be at ZIP root'
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path('queued-for-chatgpt-v1.2.8.zip.sha256').write_text(
              f'{checksum}  {archive.name}\n', encoding='utf-8')
          print(f'Packaged {archive} ({archive.stat().st_size} bytes); SHA256 {checksum}')
          PY

      - name: Publish v1.2.8 with installation package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/qfc-release-notes.md <<'NOTES'
          ## Queued for ChatGPT v1.2.8

          A lightweight Chrome / Chromebook extension for saved, sequential ChatGPT prompt workflows.

          ### New in v1.2.8
          - **Verified workflow completion:** One desktop notification after the final automatically verified reply, including the true verified prompt count and a workflow name when all steps belong to one workflow.
          - **Automatic-stop alerts:** A separate attention notification for unconfirmed sends, incomplete responses, composer/storage problems, or unexpected run interruptions. The queue still pauses conservatively; no unsafe automatic retries.
          - **Silent manual controls:** Manual Pause, deliberately stopping a response and rejected lock acquisition do not generate a misleading success alert.
          - **Memory Saver awareness:** Session-scoped active-run records allow the event-driven service worker to make a best-effort interruption notification when Chrome discards a running ChatGPT tab.
          - **Click to return:** A notification can focus the existing originating ChatGPT tab. No automatic new tabs.
          - **Resource conscious:** No servers, polling, additional DOM watchers, telemetry, or full prompt/response history in notifications. The only new permission is `notifications`; existing queue storage and sender-lock safety remain unchanged.

          ### Install or upgrade
          1. Download **queued-for-chatgpt-v1.2.8.zip** from the Assets section and extract it.
          2. At `chrome://extensions`, select **Load unpacked**, choosing the extracted folder containing `manifest.json`.
          3. When upgrading, retain the **same installed extension folder and ID** to preserve locally stored queues/workflows. Replace its files, click **Reload** in Chrome and refresh ChatGPT tabs.
          4. Check Chrome/OS notification settings if desktop alerts are not visible. Alerts can be suppressed by Focus/Do Not Disturb. Tab discards, crashes and browser shutdowns do not guarantee delivery.

          ### Validation
          Node.js unit tests and simulated Chromium tests cover verified completion, New Chat handoff, interruption, manual stop, tab discard, worker restart and notification routing. Live ChatGPT and Chromebook memory/CPU measurements are not yet verified.

          [README](https://github.com/helobym/queued-for-chatgpt#readme) · [Privacy](https://github.com/helobym/queued-for-chatgpt/blob/main/PRIVACY.md) · [MIT License](https://github.com/helobym/queued-for-chatgpt/blob/main/LICENSE)
          NOTES
          if gh release view v1.2.8 >/dev/null 2>&1; then
            echo 'v1.2.8 release already exists; refusing to overwrite tagged release assets.'
            exit 0
          fi
          gh release create v1.2.8 queued-for-chatgpt-v1.2.8.zip queued-for-chatgpt-v1.2.8.zip.sha256 \
            --title 'Queued for ChatGPT v1.2.8' \
            --notes-file /tmp/qfc-release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
